AWSTemplateFormatVersion: '2010-09-09'
Description: WanderWrap Circles - App Runner service and private ECR access

Parameters:
  ImageIdentifier:
    Type: String
    Description: Full ECR image URI including tag
  AppUrl:
    Type: String
    Description: Public HTTPS URL, for example https://circles.wanderwrap.co.uk
  PayPalClientIdSecretArn:
    Type: String
  PayPalClientSecretSecretArn:
    Type: String
  TelegramBotTokenSecretArn:
    Type: String
  TelegramWebhookSecretArn:
    Type: String
  PayPalWebhookIdSecretArn:
    Type: String
  PayPalOAuthStateSecretArn:
    Type: String
  TelegramBotUsername:
    Type: String
  EnvironmentType:
    Type: String
    Default: sandbox
    AllowedValues: [sandbox, production]
  BedrockGuardrailId:
    Type: String
    Default: ''
  BedrockGuardrailVersion:
    Type: String
    Default: ''

Conditions:
  IsProduction: !Equals [!Ref EnvironmentType, production]

Resources:
  EcrAccessRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: build.apprunner.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSAppRunnerServicePolicyForECRAccess

  AppInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: tasks.apprunner.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: WanderWrapDynamoAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:UpdateItem
                Resource:
                  - !GetAtt CirclesTable.Arn
                  - !Sub '${CirclesTable.Arn}/index/*'
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref PayPalClientIdSecretArn
                  - !Ref PayPalClientSecretSecretArn
                  - !Ref TelegramBotTokenSecretArn
                  - !Ref TelegramWebhookSecretArn
                  - !Ref PayPalWebhookIdSecretArn
                  - !Ref PayPalOAuthStateSecretArn
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                  - bedrock:ApplyGuardrail
                Resource: '*'
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: '*'

  CirclesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub 'wanderwrap-circles-${EnvironmentType}'
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: !If [IsProduction, true, false]
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
        - { AttributeName: gsi1pk, AttributeType: S }
        - { AttributeName: gsi1sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - { AttributeName: gsi1pk, KeyType: HASH }
            - { AttributeName: gsi1sk, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      Tags:
        - { Key: Application, Value: WanderWrap }
        - { Key: Environment, Value: !Ref EnvironmentType }

  ServiceAutoScaling:
    Type: AWS::AppRunner::AutoScalingConfiguration
    Properties:
      AutoScalingConfigurationName: !Sub 'wanderwrap-${EnvironmentType}'
      MaxConcurrency: 80
      MinSize: 1
      MaxSize: 10
      Tags:
        - { Key: Application, Value: WanderWrap }

  ServiceObservability:
    Type: AWS::AppRunner::ObservabilityConfiguration
    Properties:
      ObservabilityConfigurationName: !Sub 'wanderwrap-${EnvironmentType}'
      TraceConfiguration:
        Vendor: AWSXRAY
      Tags:
        - { Key: Application, Value: WanderWrap }

  CirclesService:
    Type: AWS::AppRunner::Service
    Properties:
      ServiceName: !Sub 'wanderwrap-circles-${EnvironmentType}'
      AutoScalingConfigurationArn: !GetAtt ServiceAutoScaling.AutoScalingConfigurationArn
      ObservabilityConfiguration:
        ObservabilityEnabled: true
        ObservabilityConfigurationArn: !GetAtt ServiceObservability.ObservabilityConfigurationArn
      InstanceConfiguration:
        Cpu: 1 vCPU
        Memory: 2 GB
        InstanceRoleArn: !GetAtt AppInstanceRole.Arn
      HealthCheckConfiguration:
        Protocol: HTTP
        Path: /api/telegram
        Interval: 10
        Timeout: 5
        HealthyThreshold: 1
        UnhealthyThreshold: 5
      SourceConfiguration:
        AutoDeploymentsEnabled: true
        AuthenticationConfiguration:
          AccessRoleArn: !GetAtt EcrAccessRole.Arn
        ImageRepository:
          ImageIdentifier: !Ref ImageIdentifier
          ImageRepositoryType: ECR
          ImageConfiguration:
            Port: '3000'
            RuntimeEnvironmentVariables:
              - Name: NEXT_PUBLIC_APP_URL
                Value: !Ref AppUrl
              - Name: PAYPAL_ENV
                Value: !If [IsProduction, live, sandbox]
              - Name: DYNAMODB_TABLE
                Value: !Ref CirclesTable
              - Name: AWS_REGION
                Value: eu-west-2
              - Name: BEDROCK_MODEL_ID
                Value: eu.amazon.nova-2-lite-v1:0
              - Name: ALLOW_DEMO_AUTH
                Value: 'false'
              - Name: TELEGRAM_BOT_USERNAME
                Value: !Ref TelegramBotUsername
              - Name: BEDROCK_GUARDRAIL_ID
                Value: !Ref BedrockGuardrailId
              - Name: BEDROCK_GUARDRAIL_VERSION
                Value: !Ref BedrockGuardrailVersion
            RuntimeEnvironmentSecrets:
              - Name: PAYPAL_CLIENT_ID
                Value: !Ref PayPalClientIdSecretArn
              - Name: PAYPAL_CLIENT_SECRET
                Value: !Ref PayPalClientSecretSecretArn
              - Name: TELEGRAM_BOT_TOKEN
                Value: !Ref TelegramBotTokenSecretArn
              - Name: TELEGRAM_WEBHOOK_SECRET
                Value: !Ref TelegramWebhookSecretArn
              - Name: PAYPAL_WEBHOOK_ID
                Value: !Ref PayPalWebhookIdSecretArn
              - Name: PAYPAL_OAUTH_STATE_SECRET
                Value: !Ref PayPalOAuthStateSecretArn

Outputs:
  ServiceUrl:
    Value: !GetAtt CirclesService.ServiceUrl
  ServiceArn:
    Value: !GetAtt CirclesService.ServiceArn
  TableName:
    Value: !Ref CirclesTable
