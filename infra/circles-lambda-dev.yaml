AWSTemplateFormatVersion: '2010-09-09'
Description: WanderWrap Circles pay-per-use development environment

Parameters:
  ImageUri:
    Type: String
    Description: ECR container image URI including its immutable commit tag
  CredentialsSecretId:
    Type: String
    Default: wanderwrap/circles/development
    Description: Secrets Manager secret containing the PayPal and Telegram configuration
  CredentialsRevision:
    Type: String
    Default: '1'
    Description: Increment after rotating the secret so Lambda and Telegram refresh their configuration
  ConfigureTelegram:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Configure the Telegram menu, commands, and webhook during this deployment

Conditions:
  ConfigureTelegramEnabled: !Equals [!Ref ConfigureTelegram, 'true']

Resources:
  CirclesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: wanderwrap-circles-development
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: false
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
        - { AttributeName: gsi1pk, AttributeType: S }
        - { AttributeName: gsi1sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - { AttributeName: gsi1pk, KeyType: HASH }
            - { AttributeName: gsi1sk, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      Tags:
        - { Key: Project, Value: WanderWrap-Circles }
        - { Key: Environment, Value: development }

  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: WanderWrapCirclesDevelopmentRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: CirclesRuntime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:UpdateItem
                Resource:
                  - !GetAtt CirclesTable.Arn
                  - !Sub '${CirclesTable.Arn}/index/*'
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource: '*'
      Tags:
        - { Key: Project, Value: WanderWrap-Circles }

  TelegramConfiguratorRole:
    Type: AWS::IAM::Role
    Condition: ConfigureTelegramEnabled
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ReadTelegramConfiguration
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${CredentialsSecretId}-*'
      Tags:
        - { Key: Project, Value: WanderWrap-Circles }

  TelegramConfiguratorFunction:
    Type: AWS::Lambda::Function
    Condition: ConfigureTelegramEnabled
    Properties:
      FunctionName: wanderwrap-circles-telegram-configurator
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt TelegramConfiguratorRole.Arn
      Timeout: 45
      MemorySize: 256
      Environment:
        Variables:
          APP_URL: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
          SECRET_ID: !Ref CredentialsSecretId
      Code:
        ZipFile: |
          const { SecretsManagerClient, GetSecretValueCommand } = require("@aws-sdk/client-secrets-manager");
          const secrets = new SecretsManagerClient({});

          async function respond(event, status, reason, data = {}) {
            const body = JSON.stringify({
              Status: status,
              Reason: reason,
              PhysicalResourceId: "wanderwrap-circles-telegram-configuration",
              StackId: event.StackId,
              RequestId: event.RequestId,
              LogicalResourceId: event.LogicalResourceId,
              NoEcho: true,
              Data: data,
            });
            await fetch(event.ResponseURL, {
              method: "PUT",
              headers: { "content-type": "", "content-length": Buffer.byteLength(body).toString() },
              body,
            });
          }

          async function telegram(token, method, body) {
            const response = await fetch(`https://api.telegram.org/bot${token}/${method}`, {
              method: body ? "POST" : "GET",
              headers: body ? { "content-type": "application/json" } : undefined,
              body: body ? JSON.stringify(body) : undefined,
              signal: AbortSignal.timeout(15000),
            });
            const result = await response.json();
            if (!response.ok || !result.ok) throw new Error(`${method}: ${result.description || response.status}`);
            return result.result;
          }

          exports.handler = async (event) => {
            try {
              if (event.RequestType === "Delete") {
                await respond(event, "SUCCESS", "Telegram configuration retained");
                return;
              }
              const stored = await secrets.send(new GetSecretValueCommand({ SecretId: process.env.SECRET_ID }));
              const config = JSON.parse(stored.SecretString || "{}");
              const token = config.TELEGRAM_BOT_TOKEN;
              const webhookSecret = config.TELEGRAM_WEBHOOK_SECRET;
              const appUrl = process.env.APP_URL.replace(/\/$/, "");
              if (!token || !webhookSecret) throw new Error("Telegram credentials are incomplete");
              if (!/^[A-Za-z0-9_-]{1,256}$/.test(webhookSecret)) throw new Error("Invalid Telegram webhook secret");

              const bot = await telegram(token, "getMe", {});
              await telegram(token, "setChatMenuButton", {
                menu_button: { type: "web_app", text: "Open WanderWrap", web_app: { url: appUrl } },
              });
              await telegram(token, "setMyCommands", { commands: [
                { command: "start", description: "Open WanderWrap" },
                { command: "circle", description: "Create a group gift Circle" },
                { command: "gift", description: "Plan a thoughtful group gift" },
                { command: "remember", description: "Remember a birthday or event" },
                { command: "events", description: "Show remembered events" },
                { command: "analyse_gifts", description: "Enable consented gift analysis" },
                { command: "stop_analysis", description: "Stop gift analysis" },
                { command: "privacy", description: "Explain privacy and approvals" },
              ] });
              await telegram(token, "setWebhook", {
                url: `${appUrl}/api/telegram`,
                secret_token: webhookSecret,
                allowed_updates: ["message"],
                max_connections: 20,
              });
              const webhook = await telegram(token, "getWebhookInfo", {});
              await respond(event, "SUCCESS", "Telegram configured", {
                BotUsername: bot.username,
                WebhookUrl: webhook.url,
                PendingUpdates: webhook.pending_update_count,
              });
            } catch (error) {
              await respond(event, "FAILED", error instanceof Error ? error.message : "Telegram configuration failed");
            }
          };
      Tags:
        - { Key: Project, Value: WanderWrap-Circles }

  AppLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    Properties:
      LogGroupName: /aws/lambda/wanderwrap-circles-development
      RetentionInDays: 14

  AppFunction:
    Type: AWS::Lambda::Function
    DependsOn: AppLogGroup
    Properties:
      FunctionName: wanderwrap-circles-development
      Description: WanderWrap Telegram Mini App development environment
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      Architectures: [x86_64]
      MemorySize: 1536
      Timeout: 60
      ReservedConcurrentExecutions: 5
      Role: !GetAtt FunctionRole.Arn
      Environment:
        Variables:
          NEXT_PUBLIC_APP_URL: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
          PAYPAL_CLIENT_ID: !Sub '{{resolve:secretsmanager:${CredentialsSecretId}:SecretString:PAYPAL_CLIENT_ID}}'
          PAYPAL_CLIENT_SECRET: !Sub '{{resolve:secretsmanager:${CredentialsSecretId}:SecretString:PAYPAL_CLIENT_SECRET}}'
          NEXT_PUBLIC_PAYPAL_CLIENT_ID: !Sub '{{resolve:secretsmanager:${CredentialsSecretId}:SecretString:PAYPAL_CLIENT_ID}}'
          PAYPAL_WEBHOOK_ID: !Sub '{{resolve:secretsmanager:${CredentialsSecretId}:SecretString:PAYPAL_WEBHOOK_ID}}'
          PAYPAL_OAUTH_STATE_SECRET: !Sub '{{resolve:secretsmanager:${CredentialsSecretId}:SecretString:PAYPAL_OAUTH_STATE_SECRET}}'
          PAYPAL_ENV: sandbox
          TELEGRAM_BOT_TOKEN: !Sub '{{resolve:secretsmanager:${CredentialsSecretId}:SecretString:TELEGRAM_BOT_TOKEN}}'
          TELEGRAM_WEBHOOK_SECRET: !Sub '{{resolve:secretsmanager:${CredentialsSecretId}:SecretString:TELEGRAM_WEBHOOK_SECRET}}'
          TELEGRAM_BOT_USERNAME: !Sub '{{resolve:secretsmanager:${CredentialsSecretId}:SecretString:TELEGRAM_BOT_USERNAME}}'
          CREDENTIALS_REVISION: !Ref CredentialsRevision
          DYNAMODB_TABLE: !Ref CirclesTable
          BEDROCK_MODEL_ID: eu.amazon.nova-2-lite-v1:0
          ALLOW_DEMO_AUTH: 'false'
          NODE_OPTIONS: --enable-source-maps
      Tags:
        - { Key: Project, Value: WanderWrap-Circles }
        - { Key: Environment, Value: development }

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: wanderwrap-circles-development
      Description: Development HTTPS endpoint for WanderWrap Circles
      ProtocolType: HTTP
      Tags:
        Project: WanderWrap-Circles
        Environment: development

  AppIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt AppFunction.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 30000

  DefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: $default
      Target: !Sub 'integrations/${AppIntegration}'

  DefaultStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        DetailedMetricsEnabled: true
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 25
      Tags:
        Project: WanderWrap-Circles
        Environment: development

  InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AppFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*'

  TelegramConfiguration:
    Type: Custom::TelegramConfiguration
    Condition: ConfigureTelegramEnabled
    DependsOn:
      - AppFunction
      - DefaultStage
    Properties:
      ServiceToken: !GetAtt TelegramConfiguratorFunction.Arn
      ConfigurationVersion: !Ref CredentialsRevision

  ErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: wanderwrap-circles-development-errors
      AlarmDescription: WanderWrap Circles Lambda errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref AppFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  AppUrl:
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
  FunctionName:
    Value: !Ref AppFunction
  TableName:
    Value: !Ref CirclesTable
