name: Bug report
description: Report a reproducible WanderWrap problem
title: "bug: "
labels: [bug]
body:
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options: [Telegram bot, Mini App, Agent harness, PayPal, AWS deployment, Recipient reveal]
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected behaviour }
    validations: { required: true }
  - type: textarea
    id: actual
    attributes: { label: Actual behaviour }
    validations: { required: true }
  - type: textarea
    id: reproduce
    attributes: { label: Steps to reproduce }
    validations: { required: true }
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, payment data and private chat content.
          required: true
